<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ghostfaccee</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #2c001e;
            color: #d4d4d4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .terminal {
            width: 100vw;
            height: 100vh;
            background: #300a24;
            border: 1px solid #5e2750;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .terminal-header {
            background: #1a0a15;
            padding: 10px 16px;
            border-bottom: 1px solid #5e2750;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            min-height: 44px;
        }
        .terminal-dots {
            display: flex;
            gap: 8px;
            position: absolute;
            right: 16px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #5e2750;
        }
        .terminal-title {
            color: #ffffff;
            font-size: 0.9rem;
        }
        .terminal-title .user {
            color: #4caf50;
            font-weight: 700;
        }
        .terminal-body {
            padding: 20px 24px 16px 24px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            font-size: 15px;
            line-height: 1.7;
        }
        .line {
            margin-bottom: 2px;
            line-height: 1.7;
            display: none;
            word-wrap: break-word;
        }
        .line.visible {
            display: block;
        }
        .prompt-user {
            color: #4caf50;
            font-weight: 700;
        }
        .command {
            color: #d4d4d4;
            font-weight: 700;
        }
        .output {
            color: #b0a0aa;
            padding-left: 16px;
            margin: 1px 0 3px 0;
            line-height: 1.7;
            word-wrap: break-word;
        }
        .output-highlight {
            color: #ffffff;
            font-weight: 700;
        }
        .output-muted {
            color: #7a6a74;
        }
        .output-white {
            color: #ffffff;
        }
        .output a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
        }
        .output a:hover {
            text-decoration: underline;
        }
        .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #ffffff;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 4px;
        }
        .cursor-blink.hidden {
            display: none;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        ::-webkit-scrollbar {
            width: 4px;
            background: #300a24;
        }
        ::-webkit-scrollbar-thumb {
            background: #5e2750;
            border-radius: 4px;
        }
        .neofetch-ascii {
            color: #4caf50;
            white-space: pre;
            display: inline-block;
            line-height: 1.4;
            font-size: 14px;
        }
        .neofetch-info {
            color: #b0a0aa;
            display: inline-block;
            vertical-align: top;
            line-height: 1.4;
            font-size: 14px;
        }
        .neofetch-label {
            color: #4caf50;
            font-weight: 700;
        }
        .neofetch-value {
            color: #ffffff;
        }
        .neofetch-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding: 4px 0;
        }
        @media (max-width: 768px) {
            .terminal-header {
                padding: 6px 10px;
                min-height: 32px;
            }
            .terminal-title {
                font-size: 0.65rem;
            }
            .dot {
                width: 8px;
                height: 8px;
            }
            .terminal-dots {
                gap: 4px;
                right: 10px;
            }
            .terminal-body {
                padding: 8px 10px 6px 10px;
                font-size: 11px;
                line-height: 1.4;
            }
            .line {
                line-height: 1.4;
                margin-bottom: 1px;
            }
            .output {
                padding-left: 8px;
                line-height: 1.4;
            }
            .cursor-blink {
                width: 7px;
                height: 14px;
            }
            .neofetch-container {
                flex-direction: column;
                gap: 4px;
            }
            .neofetch-ascii {
                font-size: 8px;
                line-height: 1.2;
            }
            .neofetch-info {
                font-size: 9px;
                line-height: 1.2;
            }
        }
        @media (max-width: 480px) {
            .terminal-header {
                padding: 4px 8px;
                min-height: 26px;
            }
            .terminal-title {
                font-size: 0.55rem;
            }
            .dot {
                width: 6px;
                height: 6px;
            }
            .terminal-dots {
                gap: 3px;
                right: 8px;
            }
            .terminal-body {
                padding: 5px 8px 4px 8px;
                font-size: 9px;
                line-height: 1.3;
            }
            .line {
                line-height: 1.3;
                margin-bottom: 0.5px;
            }
            .output {
                padding-left: 6px;
                line-height: 1.3;
            }
            .cursor-blink {
                width: 5px;
                height: 11px;
            }
            .neofetch-ascii {
                font-size: 6px;
                line-height: 1.1;
            }
            .neofetch-info {
                font-size: 7px;
                line-height: 1.1;
            }
            .neofetch-container {
                gap: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="terminal-header">
            <div class="terminal-title">
                <span class="user">ghostfaccee@ghostfaccee-ln: ~</span>
            </div>
            <div class="terminal-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
        <div class="terminal-body" id="terminalBody"></div>
    </div>

    <script>
        const baseCommands = [{
            cmd: 'whoami',
            output: '<span class="output-highlight">ghostfaccee</span> <span class="output-muted"> // backend developer, student</span>'
        }, {
            cmd: 'cat about.txt',
            output: '<span class="output-muted">Develop APIs, bots, and services.</span><br /><span class="output-muted">Use and study Docker, Redis, Postgres, FastAPI, and Django.</span><br /><span class="output-muted">I am looking for internships and interesting projects.</span>'
        }, {
            cmd: 'cat social.txt',
            output: '<span class="output-white">email</span>     <span class="output-muted">→</span> <a href="mailto:ghostface.host@gmail.com">ghostface.host@gmail.com</a><br/><span class="output-white">github</span>     <span class="output-muted">→</span> <a href="https://github.com/ghostfaccee" target="_blank">github.com/ghostfaccee</a><br>     <span class="output-white">leetcode</span>    <span class="output-muted">→</span> <a href="https://leetcode.com/u/ghostfaccee/" target="_blank">leetcode.com/u/ghostfaccee/</a>    <br><span class="output-white">gitflic</span>     <span class="output-muted">→</span> <a href="https://gitflic.ru/user/ghostfaccee" target="_blank">gitflic.ru/user/ghostfaccee</a>'
        }];

        function generateNeofetch() {
            const ascii = [
                '█     █   █   ',
                '█░    ██  █░  ',
                '█░░   █░█ █░░ ',
                '█░░   █░░██░░ ',
                '█████ █░░ █░░ ',
                '░░░░░ ░░  ░░  ',
                '░░░░░ ░   ░   '
            ];
            const info = [
                { label: 'Backend-frameworks', value: 'FastAPI, Django & DRF' },
                { label: 'Databases', value: 'PostgreSQL, Redis, SQLite' },
                { label: 'Devops-skills', value: 'Git, GitHub, GitFlic, Docker' },
                { label: 'Testing', value: 'pytest, pytest-asyncio, httpx' },
                { label: 'OS', value: 'Ubuntu 22.04 LTS' },
                { label: 'Editor', value: 'VS Code' },
                { label: 'Status', value: 'Open for collaboration' }
            ];
            let result = '<div class="neofetch-container">';
            result += '<div class="neofetch-ascii">' + ascii.join('\n') + '</div>';
            result += '<div class="neofetch-info">';
            info.forEach(item => {
                result += `<span class="neofetch-label">${item.label}</span> <span class="neofetch-value">${item.value}</span><br/>`;
            });
            result += '</div></div>';
            return result;
        }

        const terminalBody = document.getElementById('terminalBody');
        let commandIndex = 0;
        const commands = [
            { cmd: 'neofetch', output: generateNeofetch },
            ...baseCommands
        ];

        function createPromptLine() {
            const line = document.createElement('div');
            line.className = 'line visible';
            line.innerHTML = `
                <span class="prompt">
                    <span class="prompt-user">ghostfaccee@ghostfaccee-ln:~$</span>
                </span>
                <span class="command" id="cmdText"></span>
                <span class="cursor-blink" id="cmdCursor"></span>
            `;
            terminalBody.appendChild(line);
            return line;
        }

        function createOutputLine(html) {
            const line = document.createElement('div');
            line.className = 'line visible';
            line.innerHTML = `<div class="output">${html}</div>`;
            terminalBody.appendChild(line);
        }

        function createFinalPrompt() {
            const line = document.createElement('div');
            line.className = 'line visible';
            line.innerHTML = `
                <span class="prompt">
                    <span class="prompt-user">ghostfaccee@ghostfaccee-ln:~$</span>
                </span>
                <span class="cursor-blink" id="finalCursor"></span>
            `;
            terminalBody.appendChild(line);
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        function typeCommand(line, command, callback) {
            const cmdText = line.querySelector('#cmdText');
            const cmdCursor = line.querySelector('#cmdCursor');
            let i = 0;
            function typeChar() {
                if (i < command.length) {
                    cmdText.textContent += command[i];
                    i++;
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    setTimeout(typeChar, 40 + Math.random() * 50);
                } else {
                    cmdCursor.classList.add('hidden');
                    setTimeout(callback, 250);
                }
            }
            typeChar();
        }

        function processNextCommand() {
            if (commandIndex >= commands.length) {
                createFinalPrompt();
                return;
            }
            const cmdData = commands[commandIndex];
            const promptLine = createPromptLine();
            typeCommand(promptLine, cmdData.cmd, function() {
                const output = typeof cmdData.output === 'function' ? cmdData.output() : cmdData.output;
                createOutputLine(output);
                commandIndex++;
                setTimeout(function() {
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    processNextCommand();
                }, 500 + Math.random() * 400);
            });
        }

        setTimeout(processNextCommand, 300);
    </script>
</body>
</html>
